# Grille d'enjeux - Baromètre France
#
# Grille : enjeux d'Ipsos "What Worries the World" (WWW).
# Statut : BROUILLON v0.2, à valider avant toute collecte.
#
# Format par enjeu :
#   ipsos_label : libellé anglais tel qu'il apparaît dans les rapports WWW
#   cap_major   : code(s) des grands thèmes du Comparative Agendas Project (codebook master)
#   any         : termes FR (OR). Une chaîne avec espace = expression exacte.
#   exclude     : termes à exclure (NOT), pour limiter les faux positifs connus
#   notes       : ambiguïtés connues, à vérifier lors de l'échantillon de 50 articles
#
# Les collecteurs construisent eux-mêmes la syntaxe de chaque source à partir de
# ces listes (GDELT : (a OR "b c") -x ; Media Cloud : Lucene). On n'utilise pas de
# jokers, parce que GDELT DOC ne les supporte pas : il faut donc lister les variantes
# morphologiques. Les termes de moins de 3 caractères sont refusés par GDELT.
#
# Principes de la v0.2 :
#   - aucun terme daté (événement, personne, COP numérotée, pays en guerre) :
#     ils font monter artificiellement la série à certaines périodes ;
#   - mots seuls polysémiques remplacés par des expressions plus précises ;
#   - mots seuls de 3 lettres évités (RSA), parce que GDELT peut les refuser.
#
# Points à vérifier sur un vrai rapport Ipsos FR :
#   - liste exacte des enjeux et libellés pour chaque mois de 2020 à aujourd'hui
#     (des enjeux ont été ajoutés ou retirés, ex. Coronavirus, conflit militaire)
#   - taille d'échantillon France, si elle est publiée

version: 0.2
updated: 2026-10-18

issues:

  inflation:
    ipsos_label: "Inflation"
    cap_major: [1]            # Macroeconomics
    any:
      - inflation
      - "pouvoir d'achat"
      - "hausse des prix"
      - "flambée des prix"
      - "envolée des prix"
      - "coût de la vie"
      - "vie chère"
      - "prix de l'énergie"
      - "prix des carburants"
      - "prix à la consommation"
    exclude: []
    notes: >
      "inflation" seul capte aussi la politique monétaire de la BCE et l'inflation
      étrangère : c'est accepté, mais à surveiller dans l'échantillon.

  unemployment:
    ipsos_label: "Unemployment & jobs"
    cap_major: [5]            # Labor
    any:
      - chômage
      - chômeurs
      - "demandeurs d'emploi"
      - "France Travail"
      - "Pôle emploi"
      - licenciements
      - "plan social"
      - "plans sociaux"
      - "taux d'emploi"
    exclude: []
    notes: >
      "Pôle emploi" a été renommé "France Travail" le 1er janvier 2024 : on garde
      les deux noms pour que la série reste continue.
      "assurance chômage" est couvert par "chômage".

  poverty_inequality:
    ipsos_label: "Poverty & social inequality"
    cap_major: [13]           # Social welfare
    any:
      - pauvreté
      - précarité
      - "inégalités sociales"
      - "inégalités de revenus"
      - "inégalités de patrimoine"
      - "seuil de pauvreté"
      - "sans-abri"
      - "sans domicile fixe"
      - "aide alimentaire"
      - "Restos du coeur"
      - "Restos du cœur"
      - "fracture sociale"
    exclude:
      - "précarité énergétique"
    notes: >
      "inégalités" seul remplacé par des expressions sociales/économiques.
      "précarité énergétique" exclue : elle relève plutôt de l'énergie.

  crime_violence:
    ipsos_label: "Crime & violence"
    cap_major: [12]           # Law & crime
    any:
      - délinquance
      - criminalité
      - insécurité
      - agression
      - agressions
      - homicide
      - homicides
      - narcotrafic
      - "trafic de drogue"
      - "règlement de comptes"
      - "violences urbaines"
      - cambriolages
    exclude:
      - "insécurité alimentaire"
      - "insécurité juridique"
    notes: >
      "agression" capte aussi les agressions militaires (ex. "agression russe").
      À surveiller dans l'échantillon.

  corruption:
    ipsos_label: "Financial/political corruption"
    cap_major: [20]           # Government operations
    any:
      - corruption
      - "trafic d'influence"
      - "prise illégale d'intérêts"
      - "détournement de fonds"
      - "conflit d'intérêts"
      - "emplois fictifs"
      - "abus de biens sociaux"
      - "fraude fiscale"
    exclude: []
    notes: >
      Couvre beaucoup d'affaires étrangères : ce qui compte est l'offre
      informationnelle en France, pas le lieu des faits.
      "fraude fiscale" est rangée ici et pas dans les impôts, pour éviter un double comptage.

  taxes:
    ipsos_label: "Taxes"
    cap_major: [1]            # Macroeconomics (fiscalité)
    any:
      - impôts
      - impôt
      - fiscalité
      - "taxe foncière"
      - "taxe d'habitation"
      - "prélèvements obligatoires"
      - "hausse d'impôts"
      - "pression fiscale"
      - "matraquage fiscal"
    exclude: []
    notes: >
      Les noms de propositions datées (ex. taxe Zucman) sont volontairement absents.

  healthcare:
    ipsos_label: "Healthcare"
    cap_major: [3]            # Health
    any:
      - hôpital
      - hôpitaux
      - "services d'urgences"
      - "urgences hospitalières"
      - "déserts médicaux"
      - "désert médical"
      - "système de santé"
      - "assurance maladie"
      - "Sécurité sociale"
      - soignants
      - "médecins généralistes"
    exclude: []
    notes: >
      "urgences" seul (état d'urgence, urgence climatique...) remplacé par
      des expressions hospitalières. "hôpital" capte aussi les faits divers
      ("transporté à l'hôpital") : c'est le prochain terme à revoir si la précision est basse.

  immigration:
    ipsos_label: "Immigration control"
    cap_major: [9]            # Immigration
    any:
      - immigration
      - immigrés
      - migrants
      - "sans-papiers"
      - "demandeurs d'asile"
      - "droit d'asile"
      - OQTF
      - "reconduite à la frontière"
      - "reconduites à la frontière"
      - "politique migratoire"
      - "loi immigration"
    exclude: []
    notes: >
      "expulsions" (sens locatif fréquent) et "régularisation" (sens fiscal)
      retirés, et remplacés par des expressions propres à l'immigration.

  climate_change:
    ipsos_label: "Climate change"
    cap_major: [7]            # Environment
    any:
      - "changement climatique"
      - "réchauffement climatique"
      - "dérèglement climatique"
      - "crise climatique"
      - "gaz à effet de serre"
      - "émissions de CO2"
      - "neutralité carbone"
      - "transition écologique"
      - "conférence climat"
      - "accord de Paris"
    exclude: []
    notes: >
      Les COP numérotées ont été remplacées par "conférence climat", qui ne dépend pas de l'année.

  environment_threats:
    ipsos_label: "Threats against the environment"
    cap_major: [7]            # Environment
    any:
      - pollution
      - biodiversité
      - pesticides
      - "qualité de l'air"
      - déforestation
      - "polluants éternels"
      - PFAS
      - sécheresse
      - "pollution plastique"
    exclude: []
    notes: >
      Recoupe l'enjeu climat (sécheresse). Ipsos sépare ces deux enjeux, donc on
      les garde séparés ; un même article peut compter dans les deux.

  education:
    ipsos_label: "Education"
    cap_major: [6]            # Education
    any:
      - "Éducation nationale"
      - enseignants
      - "système éducatif"
      - "école publique"
      - collégiens
      - lycéens
      - Parcoursup
      - baccalauréat
      - "rentrée scolaire"
      - "réforme scolaire"
      - "programmes scolaires"
    exclude: []
    notes: >
      "collège", "lycée" et "l'école" seuls (simples lieux dans les faits divers)
      ont été remplacés par des termes propres au système scolaire. "professeurs" a été retiré
      (professeurs d'université, médecine).

  social_programmes:
    ipsos_label: "Maintaining social programmes"
    cap_major: [13]           # Social welfare
    any:
      - retraites
      - "réforme des retraites"
      - "minima sociaux"
      - "revenu de solidarité active"
      - "allocations familiales"
      - "aides sociales"
      - "protection sociale"
      - "assurance chômage"
      - "État-providence"
    exclude: []
    notes: >
      En France, les retraites dominent probablement cet enjeu (pic en 2023).
      "RSA" seul a été remplacé par le nom complet (GDELT risque de refuser un terme de 3 lettres).

  terrorism:
    ipsos_label: "Terrorism"
    cap_major: [16]           # Defense
    any:
      - terrorisme
      - terroriste
      - terroristes
      - attentat
      - attentats
      - djihadiste
      - djihadistes
      - Vigipirate
    exclude: []
    notes: >
      "radicalisation" a été déplacé vers l'extrémisme, pour éviter un double comptage.
      Le code CAP du terrorisme reste à vérifier dans le codebook master (16 ou 12 selon la version).

  extremism:
    ipsos_label: "Rise of extremism"
    cap_major: [20, 2]        # Government operations / Civil rights
    any:
      - extrémisme
      - extrémistes
      - ultradroite
      - ultragauche
      - néonazi
      - néonazis
      - radicalisation
      - "groupuscule violent"
      - "groupuscules violents"
    exclude: []
    notes: >
      "extrême droite", "extrême gauche" et "populisme" ont été retirés : ils désignent surtout
      la vie partisane ordinaire et surestimeraient la couverture.
      Enjeu probablement ajouté récemment par Ipsos : vérifier sa date d'entrée.

  moral_decline:
    ipsos_label: "Moral decline"
    cap_major: [23]           # Culture (approximation)
    any:
      - "déclin moral"
      - "perte de valeurs"
      - "perte des repères"
      - incivilités
      - décadence
      - ensauvagement
    exclude: []
    notes: >
      PEU FIABLE : enjeu difficile à opérationnaliser avec des mots-clés.
      La précision et le rappel seront faibles. Le signaler dans l'interface.

  military_conflict:
    ipsos_label: "Military conflict between nations"
    cap_major: [16, 19]       # Defense / International affairs
    any:
      - "conflit armé"
      - "conflits armés"
      - "frappes aériennes"
      - "frappes de missiles"
      - bombardements
      - "cessez-le-feu"
      - "offensive militaire"
      - "opérations militaires"
      - "crimes de guerre"
      - "économie de guerre"
      - OTAN
    exclude: []
    notes: >
      "guerre" seul (très souvent métaphorique) et les noms de pays ont été retirés
      pour éviter un terme daté. Risque inverse : un rappel plus faible.
      Enjeu ajouté par Ipsos en 2022 : vérifier.

  coronavirus:
    ipsos_label: "Coronavirus"
    cap_major: [3]            # Health
    any:
      - coronavirus
      - "Covid-19"
      - Covid
      - "pandémie"
      - confinement
      - "pass sanitaire"
      - "passe sanitaire"
    exclude: []
    notes: >
      Pertinent de 2020 à 2023. Vérifier quand Ipsos a cessé de le publier.
      "vaccination" a été retiré (grippe, rougeole...).

  access_to_credit:
    ipsos_label: "Access to credit"
    cap_major: [15]           # Domestic commerce (banking)
    any:
      - "crédit immobilier"
      - "taux immobiliers"
      - "accès au crédit"
      - "prêt immobilier"
      - "prêts immobiliers"
      - surendettement
    exclude: []
    notes: >
      "taux d'intérêt" a été retiré : il relève surtout de la macroéconomie et de la BCE.

# Hors grille Ipsos (pas de série demande en face) : logement (CAP 14), énergie (CAP 8).
# Non ajoutés en Phase 1.
